      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_SUPABASE_URL: https://izgtbzxrruajihrbxzyx.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_K0QhQQfypHet-L8BQOV44Q_D_UvI51j
